# APEX base configuration. Every threshold and model name lives here (spec rule 4).
# Overlay files (configs/*.yaml, configs/ablations/*.yaml) are deep-merged on top.

run:
  name: base
  seed: 42

ollama:
  url: http://127.0.0.1:11434
  timeout_s: 900          # 7B on CPU/iGPU can be slow on long prompts
  keep_alive: 30m
  max_retries: 2          # transport errors only; never a silent model fallback
  # Label for the compute backend Ollama runs on (set OLLAMA_VULKAN=1 for vulkan). It is part of the
  # generate cache key and every log record, so CPU and GPU outputs/latencies are never mixed.
  backend: vulkan         # vulkan (Intel Arc iGPU; Ollama >= 0.40 also needs OLLAMA_IGPU_ENABLE=1) | cpu

models:
  generator: qwen2.5:7b
  embedder: nomic-embed-text
  router: llama3.2:1b     # L2 classifier (M6)
  judge: gemma3:4b        # must differ from generator family (owner choice, M2)

embedding:
  doc_prefix: "search_document: "   # nomic-embed-text task prefixes
  query_prefix: "search_query: "
  batch_size: 32
  normalize: true
  # nomic-embed-text panics if one input exceeds num_batch (default 512 tokens);
  # the word-based chunk budget can exceed 512 BPE tokens, so use the model's full 2048 context.
  options: {num_ctx: 2048, num_batch: 2048}

llm:
  cache_enabled: true
  cache_path: .apex_cache/llm_cache.sqlite
  log_path: logs/llm_calls.jsonl

ingest:
  extensions: [.pdf, .md, .markdown, .txt, .html, .htm]
  chunk_target_tokens: 400
  chunk_overlap_tokens: 50

store:
  path: apex_db
  collection: nodes
  space: cosine

retrieval:
  mode: dense             # dense = M1 naive baseline (Chroma HNSW top-k) | dense_ivf | bm25 | hybrid (M3)
  top_k: 5                # hits handed to the generator (all M3 rows, so ablations stay budget-matched)
  levels: [0]
  # --- M3 hybrid retrieval (spec §2.4); unused when mode is dense ---
  dense_backend: ivf      # ivf (FAISS IndexIVFFlat) | flat (exact) | hnsw (Chroma)
  candidates: 50          # top-n from each retriever before fusion
  fused_k: 20             # fused list kept (and reranked); also the depth scored by retrieval metrics
  fusion: rrf             # rrf | weighted (ablation)
  rrf_k: 60
  weights: {dense: 0.5, bm25: 0.5}   # weighted fusion only (min-max normalised scores)

bm25:
  k1: 1.2
  b: 0.75

ivf:
  nlist: null             # null = min(round(nlist_factor * sqrt(N)), N // min_points_per_centroid)
  nlist_factor: 4
  min_points_per_centroid: 39
  nprobe: 32              # dev-tuned (results/m3_ivf_curve_dev): ANN recall@10 98.7-99.8% vs exact, ~0.1-0.2 ms

rerank:
  enabled: false
  model: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e   # HF commit, 2024-06-24
  max_length: 512
  batch_size: 1           # no padding waste; faster than 4 or 20 on this CPU
  quantize: int8          # none | int8 (dynamic int8 Linear layers: ~2x faster on CPU, same top 5 on probes)
  threads: 0              # 0 = torch default
  cache_path: .apex_cache/rerank_cache.sqlite

generation:
  temperature: 0.0
  max_tokens: 512
  num_ctx: 8192
  context_token_budget: 2500
  system_prompt: answer_system.txt

trace:
  dir: logs/traces

judge:
  temperature: 0.0
  max_tokens: 1024
  num_ctx: 8192

eval:
  data_dir: data/benchmarks       # raw files from scripts/fetch_benchmarks.py (gitignored)
  results_dir: results
  n_dev: 50                       # owner choice: 250 test + 50 dev per dataset
  n_test: 250
  unanswerable_fraction: 0.10     # injected into the pooled multi-hop sets (spec: ~10%)
  retrieval_ks: [5, 10, 20]
  ndcg_k: 10
  evidence_match: {shingle: 5, min_overlap: 0.5}
  bootstrap: {n: 1000, ci: 0.95}
  # gemma3:4b judge rejected for M2 on 8 real questions: 25% incomplete outputs, context recall 0 on correct
  # answers, 22-74 s/question. Owner decision: faithfulness/citation support move to M5's NLI model.
  judge_enabled: false
