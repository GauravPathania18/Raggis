# M1 latency probe: shrink the packed-evidence budget from 2500 to 1000 tokens.
# Single-variable change against base.yaml: retrieval still returns top-5; the packer keeps the
# highest-scoring chunks that fit (the top hit is always kept), so typically 2-3 of 5 reach the prompt.
run:
  name: ctx_budget_1000
generation:
  context_token_budget: 1000
