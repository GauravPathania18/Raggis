[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-rag"
version = "0.2.0"
description = "Hierarchical clustering RAG pipeline over dense PDFs running locally with ChromaDB and native Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.5.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "PyPDF2>=3.0.0",
    "tiktoken>=0.5.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "eval/tests"]
python_files = ["test_*.py"]
